# Builds the CPLD-Builder desktop app for Windows and Linux.
#
# Every push to main and every pull request runs the tests and uploads the
# app archives as workflow artifacts (Actions tab -> run -> Artifacts).
# Pushing a tag like `v0.2.0` also attaches them to a GitHub release.
name: CPLD-Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cpldglue/gui/frontend/package-lock.json

      - name: Linux libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2 xvfb

      - name: Editor (frontend) tests and build
        working-directory: cpldglue/gui/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Python tests
        run: |
          python -m pip install yowasp-yosys==0.70.0.0.post1259 yowasp-nextpnr-ice40==0.11.1.0.post826 \
            yowasp-nextpnr-himbaechel-gowin==0.11.1.0.post826
          # On failure, also post the output as an annotation (readable
          # without signing in, unlike the job log).
          python -m unittest discover -s tests 2> "$RUNNER_TEMP/tests.txt" && exit 0
          cat "$RUNNER_TEMP/tests.txt"
          python tools/ci_annotate.py "Python tests failed" "$RUNNER_TEMP/tests.txt"
          exit 1

      - name: Build the app
        run: |
          python -m pip install -r packaging/requirements-build.txt
          python packaging/build.py

      - name: Smoke test (command-line tool, downloads, Yosys flow)
        run: |
          export CPLDGLUE_HOME="$RUNNER_TEMP/cg"
          dist/CPLD-Builder/cpldglue devices | head -3
          dist/CPLD-Builder/cpldglue setup yosys flow
          dist/CPLD-Builder/cpldglue build examples/tinytendo.cg -o "$RUNNER_TEMP/out"
          test -f "$RUNNER_TEMP/out/tinytendo_glue.edif"

      - name: Smoke test (downloaded Gowin tools in the packaged app)
        run: |
          export CPLDGLUE_HOME="$RUNNER_TEMP/cg"
          # the copies pip installed for the tests would be found first
          python -m pip uninstall -y yowasp-nextpnr-himbaechel-gowin apycula
          dist/CPLD-Builder/cpldglue setup gowin
          dist/CPLD-Builder/cpldglue build examples/tinytendo.cg --device GW1NR-9 \
            --package QN88P -o "$RUNNER_TEMP/gw" | tee "$RUNNER_TEMP/gw.txt"
          test -f "$RUNNER_TEMP/gw/tinytendo_glue.fs"
          grep -q "Bitstream (read back with gowin_unpack) matches the design" "$RUNNER_TEMP/gw.txt"

      - name: Smoke test (the app starts and serves the editor)
        run: |
          export CPLDGLUE_HOME="$RUNNER_TEMP/cg"
          LOG="$RUNNER_TEMP/app.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dist/CPLD-Builder/CPLD-Builder examples/tinytendo.cg --port 8799 > "$LOG" 2>&1 &
          else
            dist/CPLD-Builder/CPLD-Builder.exe examples/tinytendo.cg --port 8799 > "$LOG" 2>&1 &
          fi
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8799/api/project > /dev/null; then ok=1; break; fi
            sleep 1
          done
          sleep 5      # let the window finish starting, so a crash shows up
          if [ $ok = 1 ] && curl -sf http://127.0.0.1:8799/ | grep -q '<div id="root">'; then
            echo "app is serving the editor"
            kill %1 || true
            exit 0
          fi
          echo "--- app output ---"; cat "$LOG"
          python tools/ci_annotate.py "App did not start" "$LOG"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: CPLD-Builder-${{ runner.os }}
          path: |
            dist/CPLD-Builder-*.zip
            dist/CPLD-Builder-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
